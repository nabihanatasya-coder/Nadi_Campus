<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | NadiCampus</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page auth-page">

    <main class="login-wrapper">

        <section class="login-card auth-card signup-card">
            <div class="login-content">

            <!-- BRAND -->
            <div class="brand-area">

                <div class="brand-icon">
                    <img
                            src="image/nadicampus-logo.jpg"
                            alt="NadiCampus Logo"
                            class="brand-logo-img">
                </div>

                <h1>Nadi<span>Campus</span></h1>

                <p>Student Management System</p>

            </div>

            <!-- HEADING -->
            <div class="login-heading">

                <h2>Create an Account</h2>

                <p>
                    Register to access the NadiCampus
                    administration portal.
                </p>

            </div>

            
<!-- SIGN UP FORM -->
<form id="signupForm">

    <!-- USERNAME -->
    <div class="mb-3">
        <label for="signupUsername" class="form-label">
            Username
        </label>

        <div class="input-group custom-input">
            <span class="input-group-text">
                <i class="bi bi-person"></i>
            </span>

            <input
                type="text"
                class="form-control"
                id="signupUsername"
                placeholder="Create your username"
                minlength="4"
                maxlength="30"
                pattern="[A-Za-z0-9_]+"
                autocomplete="username"
                required>
        </div>

    </div>

    <!-- PASSWORD -->
    <div class="mb-3">
        <label for="signupPassword" class="form-label">
            Password
        </label>

        <div class="input-group custom-input">
            <span class="input-group-text">
                <i class="bi bi-lock"></i>
            </span>

            <input
                type="password"
                class="form-control"
                id="signupPassword"
                placeholder="Create your password"
                minlength="8"
                autocomplete="new-password"
                required>

            <button
                type="button"
                class="input-group-text password-toggle"
                id="toggleSignupPassword"
                aria-label="Show password">

                <i class="bi bi-eye" id="signupPasswordIcon"></i>
            </button>
        </div>

        <small class="auth-field-hint">
            Minimum 8 characters.
        </small>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="mb-3">
        <label for="signupConfirmPassword" class="form-label">
            Confirm Password
        </label>

        <div class="input-group custom-input">
            <span class="input-group-text">
                <i class="bi bi-shield-lock"></i>
            </span>

            <input
                type="password"
                class="form-control"
                id="signupConfirmPassword"
                placeholder="Confirm your password"
                minlength="8"
                autocomplete="new-password"
                required>

            <button
                type="button"
                class="input-group-text password-toggle"
                id="toggleConfirmPassword"
                aria-label="Show password">

                <i class="bi bi-eye" id="confirmPasswordIcon"></i>
            </button>
        </div>
    </div>

    <!-- MESSAGE -->
    <div
        id="signupMessage"
        class="login-message"
        role="status"
        aria-live="polite">
    </div>

    <!-- CREATE ACCOUNT BUTTON -->
    <button
        type="submit"
        class="btn btn-login w-100">

        <i class="bi bi-person-plus me-2"></i>
        Create Account

    </button>

</form>

    <!-- LOGIN LINK -->
    <div class="auth-switch">
        Already have an account?
    <a href="index.html">
        Login
    </a>
    </div>

    <!-- FOOTER -->
    <div class="login-footer">
        <p>NadiCampus</p>
    </div>

</div>

    <!-- RIGHT SIDE IMAGE -->
    <div class="login-visual">
        <img
            src="image/minimalist-blue-campus.jpg"
            alt="">
    </div>

</section>

        <footer class="page-footer">
            <p>
                &copy; <span id="currentYear"></span>
                NadiCampus. All rights reserved.
            </p>
        </footer>

    </main>

    <script src="js/auth.js"></script>

</body>
</html>
