<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NadiCampus</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page auth-page">

    <main class="login-wrapper">

        <section class="login-card auth-card">

            <!-- LEFT: EDITORIAL IMAGE -->
            <div class="login-visual" aria-hidden="true">
                <img
                    src="image/minimalist-blue-campus.jpg"
                    alt="">
            </div>

            <!-- RIGHT: LOGIN CONTENT -->
            <div class="login-content">

                <!-- BRAND -->
                <div class="brand-area">

                    <div class="brand-icon">
                        <img
                            src="image/nadicampus-logo.jpg"
                            alt="NadiCampus Logo"
                            class="brand-logo-img">
                    </div>

                    <h1>Nadi<span>Campus</span></h1>

                    <p>Student Management System</p>

                </div>

                <!-- WELCOME HEADING -->
                <div class="login-heading">

                    <h2>Welcome<br>back.</h2>

                    <p>
                        Your academic workspace,
                        thoughtfully simplified.
                        Sign in to continue.
                    </p>

                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm">

                    <!-- USERNAME -->
                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label">
                            Username
                        </label>

                        <div class="input-group custom-input">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                maxlength="30"
                                required>

                        </div>

                    </div>

                    <!-- PASSWORD -->
                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label">
                            Password
                        </label>

                        <div class="input-group custom-input">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                class="input-group-text password-toggle"
                                id="togglePassword"
                                aria-label="Show password">

                                <i
                                    class="bi bi-eye"
                                    id="passwordIcon"></i>

                            </button>

                        </div>

                    </div>

                    <!-- LOGIN MESSAGE -->
                    <div
                        id="loginMessage"
                        class="login-message"
                        role="status"
                        aria-live="polite">
                    </div>

                    <!-- LOGIN BUTTON -->
                    <button
                        type="submit"
                        class="btn btn-login w-100">
                        Login
                        <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                </form>

                <!-- SIGN UP -->
                <div class="auth-switch">
                    Don't have an account?
                    <a href="signup.html">
                        Sign Up
                    </a>
                </div>

                <!-- DEMO ACCOUNT -->
                <div class="demo-quick-access">

                    <div class="demo-divider">
                        <span>OR</span>
                    </div>

                    <button
                        type="button"
                        id="useDemoBtn"
                        class="demo-quick-btn">

                        <i class="bi bi-lightning-charge-fill"></i>
                        Use Demo Account

                    </button>

                </div>

                <!-- LOGIN FOOTER -->
                <div class="login-footer">
                    <p>Academic management, made simple.</p>
                </div>

            </div>

        </section>

        <!-- PAGE FOOTER -->
        <footer class="page-footer">

            <p>
                &copy; <span id="currentYear"></span>
                NadiCampus. All rights reserved.
            </p>

        </footer>

    </main>

    <!-- AUTHENTICATION SCRIPT -->
    <script src="js/auth.js"></script>

</body>
</html>
